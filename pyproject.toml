[project]
name = "fieldsight"
version = "0.1.0"
description = "Multi-agent that reads OSHA incident packets, grounds findings in regulatory text, and drafts a cited dossier for human review."
requires-python = ">=3.11"
authors = [{name = "G3-FieldSight Team"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
