services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fieldsight
      POSTGRES_PASSWORD: fieldsight_dev
      POSTGRES_DB: fieldsight
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldsight"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: