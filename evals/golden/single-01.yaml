id: single-01
category: single_document
why: >
  One first-aid item splits two ways: Steri-Strips and butterfly bandages are first aid,
  but sutures and staples are medical treatment. Tests that the answer comes from the
  closed list in 1904.7(b)(5)(ii)(D), not general knowledge.
incident_id: null
turns:
  - command: ask
    query: "An employee's cut was closed with Steri-Strips at the clinic. Is that first aid or medical treatment? Would it be different if the clinic had used sutures?"
expected:
  outcome: answer
  answer_must_include:
    - "Steri-Strips are first aid"
    - "sutures are medical treatment"
  must_not_include:
    - "Steri-Strips are medical treatment"
    - "any wound closure is medical treatment"
  sources:
    - doc_id: CFR-1904
      section_path: "1904.7"
      paragraph: "(b)(5)(ii)(D)"