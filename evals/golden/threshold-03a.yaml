id: threshold-03a
category: threshold
pair_id: threshold-03
why: >
  Tests the 180-day cap in 1904.7(b)(3)(vii) from below: 150 days away plus 29 restricted
  is 179, which is recorded as-is. Also checks that days away and restricted days combine
  toward the cap, which the Form 300 instructions state and the regulation implies.
incident_id: null
turns:
  - command: ask
    query: "An employee injured on January 5, 2026 was away from work for 150 calendar days, then on restricted duty for 29 more. Which OSHA 300 Log column does this go in, and what day count do we enter?"
threshold:
  rule_id: R4
  boundary: "180 combined calendar days away and restricted"
  boundary_source: "29 CFR 1904.7(b)(3)(vii); Form 300 instructions"
  value: 179
  side: below
  rule_inputs:
    recordable: true
    death: false
    days_away: 150
    restricted_days: 29
    job_transfer: false
  expected_rule_outcome: H
  expected_day_count: 179
expected:
  outcome: answer
  rules_engine_invocation_required: true
  answer_must_include:
    - "column H (days away from work)"
    - "179 days"
    - "days away is the more serious outcome, so it takes column H over column I"
  must_not_include:
    - "goes in column I"
    - "enter 180"
  sources:
    - doc_id: CFR-1904
      section_path: "1904.7"
      paragraph: "(b)(3)(vii)"
    - doc_id: FORM-301
      section_path: "overview"
      paragraph: "column definitions; counting days away and restricted days"