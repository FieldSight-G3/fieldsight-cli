name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check . --extend-exclude corpus

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fieldsight
          POSTGRES_PASSWORD: fieldsight_dev
          POSTGRES_DB: fieldsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      FIELDSIGHT_ENVIRONMENT: ci
      FIELDSIGHT_AWS_REGION: us-east-1
      FIELDSIGHT_BEDROCK_MODEL_ID: ci-placeholder
      FIELDSIGHT_BEDROCK_FAST_MODEL_ID: ci-placeholder
      FIELDSIGHT_BEDROCK_JUDGE_MODEL_ID: ci-placeholder
      FIELDSIGHT_BEDROCK_EMBEDDING_MODEL_ID: ci-placeholder
      FIELDSIGHT_BEDROCK_KB_ID: ci-placeholder
      FIELDSIGHT_BEDROCK_KB_DATA_SOURCE_ID: ci-placeholder
      FIELDSIGHT_BEDROCK_GUARDRAIL_ID: ci-placeholder
      FIELDSIGHT_BEDROCK_GUARDRAIL_VERSION: "1"
      FIELDSIGHT_PACKET_BUCKET: ci-placeholder
      FIELDSIGHT_DATABASE_URL: postgresql://fieldsight:fieldsight_dev@localhost:5432/fieldsight
      FIELDSIGHT_RETRIEVAL_SCORE_THRESHOLD: "0.5"
      FIELDSIGHT_RETRIEVAL_MAX_CHUNKS: "8"
      FIELDSIGHT_CONFIDENCE_FLOOR: "0.7"
      FIELDSIGHT_GATEWAY_API_KEY: ci-placeholder
      FIELDSIGHT_ALLOW_DEV_IDENTITY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run unit tests
        run: pytest -v 

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
